<!DOCTYPE html>
<html>
<head>
	<meta http-equiv="Content-Type" content="text/html; charset=utf-8">
	<title>Tmap 경로 안내 예제</title>
	<script src="https://code.jquery.com/jquery-3.2.1.min.js"></script>
	<script src="https://apis.openapi.sk.com/tmap/jsv2?version=1&appKey=h5baCQSfp37eFmXohbwx23t7n1KLSIcn3RyFtMcg"></script>
	<script type="text/javascript">
		var map;
		// 1. 지도 띄우기
		function initTmap() {
			map = new Tmapv2.Map("map_div", {
				center: new Tmapv2.LatLng(37.52084364186228, 127.058908811749),
				width: "100%",
				height: "600px",
				zoom: 12
			});

			// 2. 시작, 도착, 경유지 좌표 설정
			var startPt = new Tmapv2.LatLng(37.519892712436906, 127.02810900563199);
			var endPt = new Tmapv2.LatLng(37.52130314703887, 127.13281976335786);
			var passList = [
				new Tmapv2.LatLng(37.524162226778515, 127.04724656694417),
				new Tmapv2.LatLng(37.5289781669373, 127.10887300128256)
			];

			// 3. 마커 생성
			// 시작 마커
			var marker_s = new Tmapv2.Marker({
				position: startPt,
				icon: "http://tmapapi.sktelecom.com/upload/tmap/marker/pin_r_m_s.png",
				iconSize: new Tmapv2.Size(24, 38),
				map: map
			});

			// 도착 마커
			var marker_e = new Tmapv2.Marker({
				position: endPt,
				icon: "http://tmapapi.sktelecom.com/upload/tmap/marker/pin_r_m_e.png",
				iconSize: new Tmapv2.Size(24, 38),
				map: map
			});

			// 경유지 마커
			for (var i = 0; i < passList.length; i++) {
				new Tmapv2.Marker({
					position: passList[i],
					icon: "http://tmapapi.sktelecom.com/upload/tmap/marker/pin_b_m_p.png",
					iconSize: new Tmapv2.Size(24, 38),
					map: map
				});
			}

			// 4. 경로 탐색 API 요청
			var tdata = new Tmapv2.TData();
			var params = {
				// "startName": "출발",
				// "endName": "도착",
				"startX": startPt.lng(),
				"startY": startPt.lat(),
				"endX": endPt.lng(),
				"endY": endPt.lat(),
				"passList": passList.map(p => p.lng() + ',' + p.lat()).join('_'),
				"reqCoordType": "WGS84GEO",
				"resCoordType": "EPSG3857",
				"searchOption": "0",
				"trafficInfo": "Y"
			};

			tdata.getRoutePlanJson(params, function(data) {
				var resultData = data.features;
				var drawInfoArr = [];

				for (var i in resultData) {
					var geometry = resultData[i].geometry;
					var properties = resultData[i].properties;
					if (geometry.type == "LineString") {
						for (var j in geometry.coordinates) {
							var latlng = new Tmapv2.Point(geometry.coordinates[j][0], geometry.coordinates[j][1]);
							var convertPoint = new Tmapv2.Projection.convertEPSG3857ToWGS84GEO(latlng);
							drawInfoArr.push(new Tmapv2.LatLng(convertPoint._lat, convertPoint._lng));
						}
					}
				}
				
				// 5. 경로 그리기
				var polyline = new Tmapv2.Polyline({
					path: drawInfoArr,
					strokeColor: "#FF0000",
					strokeWeight: 6,
					map: map
				});
				
				map.fitBounds(drawInfoArr);
			});
		}
	</script>
</head>
<body onload="initTmap();">
	<div id="map_div" style="width:100%; height:600px;"></div>
</body>
</html>
